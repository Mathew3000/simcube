; partsim firmware for an ESP32-S3 driving six 32x32 HUB75 panels as a cube.
;
; core/ is consumed via symlink:// rather than copied, so editing the simulation and reflashing
; picks the change up immediately -- there is exactly one copy of the physics in the repo.
;
; The capacity profile is ONE flag, -DPARTSIM_PROFILE_ESP32. The numbers themselves live in
; core/include/partsim/Config.h so that scripts/check_esp32_budget.sh measures the same pools
; this firmware ships with; spelling them out here would create a second copy of the budget.

[platformio]
default_envs = cube

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1

; N16R8: 16MB quad flash, 8MB OCTAL PSRAM. qio_opi is the octal-PSRAM memory type -- with the
; wrong value here the board boots and then behaves erratically once PSRAM is touched.
;
; Note the cost: octal PSRAM permanently consumes IO35/36/37, which is why Pins.h avoids them.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
  symlink://../../core
  ; HUB75 driver. On the S3 this uses LCD_CAM + GDMA rather than the original I2S path, which
  ; is what makes 6-bit colour at >120 Hz affordable.
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11

build_unflags =
  -std=gnu++11
  -ffp-contract=fast

build_flags =
  -std=gnu++17
  -O2
  -DPARTSIM_PROFILE_ESP32=1
  ; Determinism, same as every other target: Xtensa will otherwise fuse a*b+c into MADD.S with
  ; different rounding to WASM's separate multiply and add, and the trajectories diverge within
  ; a few hundred steps. This is why the `g` console command can be compared against
  ; scripts/golden_hash_esp32.txt at all.
  -ffp-contract=off
  ; Turns sqrtf into an inline hardware sequence instead of a call that also sets errno.
  -fno-math-errno
  ; A stray `0.5` or `sqrt()` promotes to double, which the S3 emulates in software and which
  ; silently halves the framerate. Errors, not warnings.
  -Wdouble-promotion
  -Wfloat-conversion
  -Wall
  -Wextra
  ; The S3's LCD_CAM clock divider. 10 with HZ_16M is the combination that measured a stable
  ; 141 Hz true BCM refresh at 6-bit depth on a 192x32 chain.
  -DS3_LCD_DIV_NUM=10
  ; No Adafruit_GFX. The plan already established that VirtualMatrixPanel cannot express a cube,
  ; so we drive the raw canvas and map faces ourselves (core/src/ChainMap.cpp) -- which means the
  ; GFX drawing primitives, their font tables and the whole Adafruit dependency chain are dead
  ; weight. drawPixelRGB888, clearScreen and flipDMABuffer are the library's own.
  -DNO_GFX
  ; NEVER define SPIRAM_DMA_BUFFER. Putting the panel framebuffer in PSRAM halves the bandwidth
  ; the CPU gets and the display develops visible tearing under simulation load.

; WiFi and Bluetooth are off: together they cost ~55KB of the heap this budget cannot spare,
; their ISRs add jitter to a display that is being clocked at 16MHz, and the panels' EMF
; degrades the S3's radio anyway. Nothing here needs a network.
board_build.partitions = huge_app.csv

[env:cube]
; The shipping configuration: six faces, deterministic maths.

[env:cube-fast]
; Opt-in performance build. Allowing FMA contraction is worth a few percent, and it BREAKS the
; cross-target determinism claim -- the `g` console command will not match
; scripts/golden_hash_esp32.txt in this environment, by construction. The firmware says so at
; boot rather than letting the mismatch look like a bug.
;
; The plan called for -ffp-contract=fast on the device unconditionally. That cannot coexist with
; a third-target determinism check, so it became a separate, labelled environment instead.
build_unflags =
  ${env.build_unflags}
  -ffp-contract=off
build_flags =
  ${env.build_flags}
  -ffp-contract=fast
  -DPARTSIM_NONDETERMINISTIC_FP=1

[env:panel]
; Bring-up environment for ONE panel, before six of them exist. Same firmware, one face --
; which is the whole point of the slab mode in the simulation core.
build_flags =
  ${env.build_flags}
  -DPARTSIM_FACE_COUNT=1

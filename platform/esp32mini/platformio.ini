; partsim firmware for a PLAIN ESP32 (Xtensa LX6, dual core, 240 MHz) driving six 8x8 WS2812B
; matrices as the shell of the cube -- 384 LEDs, one data chain. See MINI.md.
;
; This is its own PlatformIO project, not another environment in platform/esp32/platformio.ini:
; that file's [env] hardcodes `board = esp32-s3-devkitc-1` and octal-PSRAM settings neither of
; which a plain ESP32 environment can sensibly un-set, and it pulls in the HUB75 DMA library this
; board has no use for.
;
; core/ and platform/app/ are consumed via symlink://, exactly as platform/esp32/ does, so there
; stays exactly ONE copy of the physics and of the application layer -- this is the HAL's second
; real platform, not a fork of the first.

[platformio]
default_envs = mini

[env]
platform = espressif32
framework = arduino
board = esp32dev   ; plain ESP32, dual core, 240MHz -- see MINI.md section 2. NOT an S3.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
  symlink://../../core
  symlink://../app
  fastled/FastLED@^3.10.3

build_unflags =
  -std=gnu++11
  -ffp-contract=fast

build_flags =
  -std=gnu++17
  -O2
  -DPARTSIM_PROFILE_ESP32_MINI=1
  -DPARTSIM_TIER_MINI=1
  ; Determinism, same reasoning and the same flags as platform/esp32/platformio.ini: Xtensa will
  ; otherwise fuse a*b+c into an FMA with different rounding than WASM's separate multiply-add,
  ; and the trajectories diverge within a few hundred steps.
  -ffp-contract=off
  -fno-math-errno
  -Wdouble-promotion
  -Wfloat-conversion
  -Wall
  -Wextra

[env:mini]
; The shipping configuration: six faces, deterministic maths, no radio.

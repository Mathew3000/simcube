<!doctype html>
<meta charset="utf-8">
<title>partsim — LED cube</title>
<style>
  :root { color-scheme: dark; --fg: #e8eef5; --dim: #7d8b9c; --line: #253040; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; color: var(--fg);
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { display: block; }

  #ui { position: fixed; left: 16px; top: 14px; pointer-events: none;
        text-shadow: 0 1px 3px #000; }
  #ui h1 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  #ui p { margin: 0; color: var(--dim); max-width: 44ch; }
  #hud { position: fixed; left: 16px; bottom: 14px; display: flex; gap: 18px; flex-wrap: wrap;
         align-items: center; color: var(--dim); }
  #hud b { color: var(--fg); font-weight: 600; }
  #hud button { pointer-events: auto; font: inherit; background: #101620cc; color: var(--fg);
                border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px;
                cursor: pointer; }
  #hud button:hover { border-color: #3b4c63; }
  #hud select { pointer-events: auto; font: inherit; background: #101620cc; color: var(--fg);
                border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  #err { position: fixed; inset: 0; display: none; place-content: center; padding: 40px;
         color: #ff8080; white-space: pre-wrap; }
</style>

<div id="ui">
  <h1>partsim — 6 × 32×32 LED cube</h1>
  <p>
    <b>drag</b> tilts the cube (gravity stays world-down, so it sloshes) ·
    <b>flick + release</b> shakes it ·
    <b>right-drag</b> orbits the camera · <b>scroll</b> zooms
  </p>
</div>

<div id="hud">
  <span>fps <b id="fps">–</b></span>
  <span>sim <b id="sim">–</b> ms</span>
  <span>render <b id="render">–</b> ms</span>
  <span>particles <b id="parts">–</b></span>
  <select id="scene"></select>
  <button id="palette">palette</button>
  <button id="cycle">auto-cycle</button>
  <button id="bloomBtn">bloom</button>
  <button id="reset">reset</button>
  <a href="./panels.html" style="color:var(--dim)">panel view</a>
  <a href="./orient.html" style="color:var(--dim)">orientation check</a>
</div>

<div id="err"></div>

<!-- OrbitControls does `import ... from 'three'`, so the bare specifier needs mapping. This is
     why the vendored copy works with no bundler at all. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { createCubeView } from './cubeview.js';
import createPartsim from './public/partsim.mjs';

const errEl = document.getElementById('err');
const fail = (msg) => {
  errEl.style.display = 'grid';
  errEl.textContent = msg;
};

let mod;
try {
  mod = await createPartsim();
} catch (e) {
  fail(`Failed to load the WASM module: ${e.message}\n\n` +
       `Run scripts/build_wasm.sh, then serve over http:// (not file://).`);
  throw e;
}

if (!mod._ps_init_scene(0, 0, 0xc0ffee)) {
  fail('ps_init_scene failed');
  throw new Error('ps_init_scene');
}

// Scene names live in the WASM heap as NUL-terminated strings; read them out once.
const sceneName = (i) => {
  let p = mod._ps_scene_name(i), out = '';
  for (; mod.HEAPU8[p] !== 0; p++) out += String.fromCharCode(mod.HEAPU8[p]);
  return out;
};

// Scene, panel quads and orbit camera all come from cubeview.js, shared with orient.html so the
// orientation checker exercises the same placement code this page does.
const view = createCubeView(mod);
const { scene, camera, renderer, controls, cube, panels, camRight, camUp, render } = view;

// ?tilt=<degrees> pre-rotates the cube about world Z. Exists so the full
// JS -> ps_set_orientation -> solver path can be verified in a headless screenshot: a slanted
// waterline in 3D proves the orientation plumbing end to end, which a level tank cannot.
{
  const deg = Number(new URLSearchParams(location.search).get('tilt'));
  if (Number.isFinite(deg) && deg !== 0)
    cube.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), (deg * Math.PI) / 180);
}

// --- tilt and flick --------------------------------------------------------
// Dragging rotates the OBJECT while gravity stays world-down, which is what makes the water
// slosh. Orbiting a camera would look nearly identical and do nothing at all.
const DRAG = 0.008;
let dragging = false, velX = 0, velY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  velX = velY = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  velX = e.movementX;
  velY = e.movementY;
  // Rotate about the CAMERA's axes so the gesture feels the same from any viewpoint.
  const q = new THREE.Quaternion()
    .setFromAxisAngle(camUp(), e.movementX * DRAG)
    .multiply(new THREE.Quaternion().setFromAxisAngle(camRight(), e.movementY * DRAG));
  cube.quaternion.premultiply(q);
});

const endDrag = (e) => {
  if (!dragging) return;
  dragging = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch { /* already gone */ }

  // A quick flick becomes an acceleration OF THE CONTAINER, in world space. Note the sign:
  // shoving the cube right piles the water left, which is correct -- inside a container its
  // acceleration is indistinguishable from gravity the other way.
  const speed = Math.hypot(velX, velY);
  if (speed > 5) {
    const impulse = camRight().multiplyScalar(velX * 3.0)
      .add(camUp().multiplyScalar(-velY * 3.0));
    const q = cube.quaternion;
    mod._ps_add_jerk(q.x, q.y, q.z, q.w, impulse.x, impulse.y, impulse.z);
  }
};
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

// --- ui --------------------------------------------------------------------
const sceneSel = document.getElementById('scene');
for (let i = 0; i < mod._ps_scene_count(); i++) {
  const o = document.createElement('option');
  o.value = String(i);
  o.textContent = sceneName(i);
  sceneSel.append(o);
}
sceneSel.onchange = () => mod._ps_set_scene(Number(sceneSel.value));

// ?scene=<n> selects a preset at load, so any scene can be captured headlessly.
{
  const want = Number(new URLSearchParams(location.search).get('scene'));
  if (Number.isFinite(want) && want > 0 && want < mod._ps_scene_count()) {
    mod._ps_set_scene(want);
    sceneSel.value = String(want);
  }
}

let paletteIdx = 0;
document.getElementById('palette').onclick = () => {
  paletteIdx = (paletteIdx + 1) % mod._ps_palette_count();
  mod._ps_set_palette(paletteIdx);
};
document.getElementById('reset').onclick = () => {
  mod._ps_set_scene(Number(sceneSel.value));
  cube.quaternion.identity();
};
const cycleBtn = document.getElementById('cycle');
cycleBtn.onclick = () => {
  const on = mod._ps_auto_cycle() === 0;
  mod._ps_set_auto_cycle(on ? 1 : 0);
  cycleBtn.textContent = on ? 'cycling' : 'auto-cycle';
  cycleBtn.style.color = on ? '#8fe3a0' : '';
};
const bloomBtn = document.getElementById('bloomBtn');
let bloomOn = true;
bloomBtn.onclick = () => {
  bloomOn = !bloomOn;
  view.setBloom(bloomOn);
  bloomBtn.style.color = bloomOn ? '' : '#7d8b9c';
};

// --- frame loop ------------------------------------------------------------
const el = {
  fps: document.getElementById('fps'), sim: document.getElementById('sim'),
  render: document.getElementById('render'), parts: document.getElementById('parts'),
};
let prev = performance.now(), fpsAcc = 0, fpsN = 0, hudAt = 0;

function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.25);
  prev = now;

  const q = cube.quaternion;
  mod._ps_set_orientation(q.x, q.y, q.z, q.w);

  const t0 = performance.now();
  mod._ps_advance(dt);
  const t1 = performance.now();
  mod._ps_render();
  const t2 = performance.now();
  mod._ps_set_stats_timing(t1 - t0, t2 - t1);

  // The views alias WASM memory directly, so there is nothing to copy -- just tell three the
  // texels changed. This is only safe because ALLOW_MEMORY_GROWTH is off; growth would detach
  // every one of these views and the cube would go black with no error.
  for (const p of panels) p.tex.needsUpdate = true;

  controls.update();
  render();

  fpsAcc += dt; fpsN++;
  if (now - hudAt > 250) {
    hudAt = now;
    // Auto-cycle changes the scene inside the sim, so mirror it back into the dropdown.
    if (mod._ps_auto_cycle()) sceneSel.value = String(mod._ps_scene());
    const s = new Float32Array(mod.HEAPF32.buffer, mod._ps_stats(), 4);
    el.fps.textContent = (fpsN / fpsAcc).toFixed(0);
    el.sim.textContent = s[0].toFixed(2);
    el.render.textContent = s[1].toFixed(2);
    el.parts.textContent = s[2].toFixed(0);
    fpsAcc = 0; fpsN = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

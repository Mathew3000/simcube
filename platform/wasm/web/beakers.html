<!doctype html>
<meta charset="utf-8">
<title>partsim — beaker chain</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; color: #cfd8dc;
               font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(8,12,16,.9);
        border: 1px solid #1b2634; border-radius: 4px; padding: 12px 14px; width: 430px;
        max-height: calc(100vh - 24px); overflow-y: auto; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 4px; letter-spacing: .04em;
       text-transform: uppercase; color: #7f8c99; }
  h2 { font-size: 11px; font-weight: 600; margin: 14px 0 6px; letter-spacing: .06em;
       text-transform: uppercase; color: #56626e; border-top: 1px solid #141d27; padding-top: 9px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .row label { flex: 0 0 86px; color: #8b98a6; }
  input[type=range] { flex: 1; min-width: 0; }
  .val { flex: 0 0 52px; text-align: right; color: #e0e6eb; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 2px 5px 2px 0; white-space: nowrap; }
  th { color: #6f7c89; font-weight: 500; font-size: 10.5px; text-transform: uppercase;
       letter-spacing: .05em; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #4bbf73; } .warn { color: #e0a33e; } .bad { color: #d9534f; }
  .dim { color: #56626e; }
  button { background: #16202b; color: #cfd8dc; border: 1px solid #24313f; border-radius: 3px;
           padding: 2px 7px; cursor: pointer; font: inherit; font-size: 11px; }
  button:hover { border-color: #3a4a5c; }
  button.on { background: #24313f; border-color: #4bbf73; color: #cfe8d6; }
  select { background: #101620; color: #cfd8dc; border: 1px solid #24313f; border-radius: 3px;
           font: inherit; font-size: 11px; padding: 1px 2px; }
  input[type=color] { width: 26px; height: 18px; padding: 0; border: 1px solid #24313f;
                      background: #101620; cursor: pointer; }
  .swatch { display: inline-block; width: 26px; height: 14px; border: 1px solid #24313f;
            vertical-align: -2px; }
  .bar { height: 4px; background: #141d27; border-radius: 2px; overflow: hidden; width: 52px;
         display: inline-block; vertical-align: 1px; }
  .bar i { display: block; height: 100%; background: #3f8fd0; }
  #note { margin-top: 10px; color: #6f7c89; font-size: 11px; line-height: 1.45; }
  #err { position: fixed; inset: 0; display: none; place-items: center; background: #05070a;
         color: #d9534f; padding: 40px; text-align: center; white-space: pre-wrap; z-index: 99; }
  .hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #56626e;
          font-size: 11.5px; z-index: 5; }
</style>

<div id="ui">
  <h1>Beaker chain</h1>
  <div class="dim" id="cfg"></div>
  <div class="dim" id="perf"></div>

  <h2>Beakers</h2>
  <table>
    <thead><tr>
      <th>#</th><th>dye</th><th>mixed</th><th class="n">fill</th><th></th><th>→</th><th></th>
    </tr></thead>
    <tbody id="brows"></tbody>
    <tfoot><tr>
      <th colspan="3">ring total</th><th class="n" id="totFill"></th>
      <th colspan="3" id="totNote"></th>
    </tr></tfoot>

  <h2>Tilt</h2>
  <div class="row">

    <span class="val" id="tiltAllV">0°</span>
  </div>
  <div class="row"><label>per beaker</label><span class="dim">sliders in the table above</span></div>

  <div class="row">
    <label>drop</label><input id="drop" type="range" min="0" max="100" value="0">
    <span class="val" id="dropV">0%</span>
  </div>
  <div class="row">
    <label>delay</label><input id="lat" type="range" min="0" max="30" value="0">
    <span class="val" id="latV">0f</span>
  </div>
  <div class="row">
    <label>corrupt</label><input id="cor" type="range" min="0" max="100" value="0">
    <span class="val" id="corV">0%</span>
  </div>
  <div class="row">
    <label>link</label>
    <button id="ringBtn" class="on">ring closed</button>
    <button id="resetAll">reset all</button>

  </div>

    <label>carrier</label>

    <button id="addrBtn" class="on">addressed</button>
  </div>

  <h2>Chain</h2>
  <table>
    <thead><tr><th>#</th><th class="n">out</th><th class="n">in</th><th class="n">unsent</th>
      <th class="n">short</th><th class="n">made</th><th class="n">bad</th><th class="n">refus</th>
      <th class="n">drop</th></tr></thead>

</div>
<div class="hint">drag tilts every beaker · right-drag orbits · scroll zooms</div>
<div id="err"></div>

<!-- OrbitControls and beakerview.js both do `import ... from 'three'`, so the bare specifier
     needs mapping. Without this the module graph fails to resolve and NOTHING runs -- the static
     panel still renders, which looks like a page that loaded and did nothing. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import createPartsim from './public/partsim_beaker.mjs';
import { createBeakerView } from './beakerview.js';

// Anything thrown from here on lands on the page rather than in a console nobody has open. This
// page is a debugging surface; a blank screen with the panel still drawn is the least informative
// thing it could do.
const showErr = (msg) => {
  const e = document.getElementById('err');
  e.style.display = 'grid';
  e.textContent = msg;
};
addEventListener('error', (e) => showErr(String(e.error?.stack || e.message)));
addEventListener('unhandledrejection', (e) => showErr(String(e.reason?.stack || e.reason)));

const fail = (msg) => { showErr(msg); throw new Error(msg); };

const qs = new URLSearchParams(location.search);
const RES = (() => { const v = parseInt(qs.get('res') || '32', 10); return (v === 32 || v === 64) ? v : 32; })();

const mod = await createPartsim();

// The trap this page exists downstream of: PARTSIM_ENABLE_CHROMA comes from the beaker TIER, and a
// module built without it has one accumulation channel, no cr/cg arrays and no dye at all. The
// symptom is a ring of identical blue cubes -- indistinguishable from a mix that will not converge,
// which is exactly the bug this page is meant to find. So it is checked, not assumed.
if (!mod._ps_beaker_has_chroma()) {
  fail('This module was built without PARTSIM_ENABLE_CHROMA.\n\n' +
       'beakers.html needs the beaker-tier artifact:\n\n' +
       '    scripts/build_wasm.sh --beaker\n\n' +
       'Note that `scripts/build_wasm.sh -DPARTSIM_ENABLE_CHROMA=1` does NOT work: only\n' +
       'PARTSIM_MAX_* are forwarded as CMake cache variables, so that -D sets an option\n' +
       'nothing reads and produces this artifact.');
}

const MAXN = mod._ps_beaker_max();
const N = (() => {
  const v = parseInt(qs.get('n') || '3', 10);
  return (v >= 1 && v <= MAXN) ? v : 3;
})();

// Four is a memory ceiling, not a preference: ALLOW_MEMORY_GROWTH is off (growth detaches every
// panel view above) and INITIAL_MEMORY is 32MB against a 3.25MB Simulation.
if (!mod._ps_beaker_init(N, RES))
  fail(`ps_beaker_init(${N}, ${RES}) failed — capacity too small, or more than ${MAXN} beakers.`);

// Red, blue, green, yellow: three distinguishable primaries plus one mix, so a ring of any size
// starts with beakers that can be told apart at a glance.
const START_DYE = [[255, 0], [0, 0], [0, 255], [200, 200]];
for (let i = 0; i < N; i++) mod._ps_beaker_set_dye(i, START_DYE[i % 4][0], START_DYE[i % 4][1]);

const view = createBeakerView(mod, N, { openFace: mod._ps_beaker_open_face() });
const THREE = view.THREE;

document.getElementById('cfg').textContent =
  `${N} beakers · ${RES}×${RES} panels · d=${mod._ps_beaker_rest_spacing()} · ` +
  `fill ${mod._ps_beaker_fill(0)} of capacity ${mod._ps_beaker_capacity(0)} ` +
  `(${Math.round(100 * mod._ps_beaker_fill(0) / mod._ps_beaker_capacity(0))}%)`;

// --- heap views ---------------------------------------------------------------------------------
// Built per call rather than cached: these point at small fixed staging arrays that the module
// rewrites on every read, and the cost is a view object, not a copy.
const chromaOf = (i) => new Float32Array(mod.HEAPU8.buffer, mod._ps_beaker_chroma_ptr(i), 4);
const NSTAT = mod._ps_beaker_stat_count();
const statsOfN = (i) => new Uint32Array(mod.HEAPU8.buffer, mod._ps_beaker_stats_ptr(i), NSTAT);
const S = { pktOut: 0, pktIn: 1, partOut: 2, partIn: 3, bad: 4, rejected: 5,
            madeUp: 6, unsent: 7, shortfall: 8, owed: 9, queueDropped: 10, carrier: 11,
            foreign: 12 };

// --- the chain ----------------------------------------------------------------------------------
// The MODULE does not know the order. It hands out one beaker's packets and accepts another's, and
// which is which is this array -- chain order is user configuration on a real cube, so putting it
// in C++ would make the page prove something the firmware does not do.
let downstream = Array.from({ length: N }, (_, i) => (i + 1) % N);
let ringClosed = true;
// The radio is a BROADCAST: every cube in earshot hears every packet, and only the header's `from`
// byte keeps a ring of three from injecting what both of its neighbours poured (D66). This page can
// deliver either way, because point-to-point makes the ring easy to read and broadcast is what the
// hardware actually does -- and a browser that can only do the easy one cannot debug the other.
let broadcast = false;
let addressed = true;

// The ring position each beaker is told, derived by WALKING the configured order rather than
// assuming 0->1->2. The dropdowns can express any permutation, and an addressing that ignored them
// would be addressing a chain nobody configured. A configuration that is not a single closed ring
// has no positions to derive, so it goes unaddressed and the page says so.
function ringOrder() {
  const pos = new Array(N).fill(-1);
  let cur = 0;
  for (let k = 0; k < N; k++) {
    if (cur == null || cur < 0 || pos[cur] >= 0) return null;
    pos[cur] = k;
    cur = downstream[cur];
  }
  return cur === 0 ? pos : null;   // must close back onto the start
}

function applyAddressing() {
  const pos = addressed ? ringOrder() : null;
  for (let i = 0; i < N; i++) {
    if (pos) mod._ps_beaker_set_chain_position(i, pos[i], N);
    else mod._ps_beaker_set_chain_position(i, 0, 0);   // unaddressed: take from anyone
  }
  return pos;
}

const inflight = [];       // { bytes, dst, at }  -- JS physically holds every packet in the air
let frameNo = 0;
let dropRate = 0, latency = 0, corruptRate = 0;
let jsDropped = 0, jsCorrupted = 0, jsDelivered = 0;
// Counter baselines, so "zero counters" can rebase the display without resetting the chain state
// the counters are evidence about.
let base = Array.from({ length: N }, () => new Uint32Array(mod._ps_beaker_stat_count()));

// Split the outbox back into packets. The module writes each one length-prefixed (packets are at
// most 250 bytes, so one byte is enough); the prefix is framing for this loop only and is never
// handed back — ps_beaker_deliver takes an explicit length.
function packetsFrom(i) {
  const len = mod._ps_beaker_out_len(i);
  if (len <= 0) return [];
  const at = mod._ps_beaker_out_ptr(i);
  const buf = mod.HEAPU8.subarray(at, at + len);
  const out = [];
  let o = 0;
  while (o + 1 <= len) {
    const n = buf[o++];
    if (n === 0 || o + n > len) break;
    // slice, not subarray: the outbox is rewritten at the top of the next step, and a delayed
    // packet has to carry the bytes it was sent with.
    out.push(buf.slice(o, o + n));
    o += n;
  }
  return out;
}

let scratch = 0;   // one heap staging buffer, allocated once — nothing allocates per frame
function deliver(dst, bytes) {
  if (!scratch) scratch = mod._malloc(256);
  mod.HEAPU8.set(bytes, scratch);
  if (mod._ps_beaker_deliver(dst, scratch, bytes.length)) jsDelivered++;
}

function stepChain(dt) {
  frameNo++;
  for (let i = 0; i < N; i++) {
    // advance + pump, in that order, inside the module. advance() clears the spill queue once per
    // FRAME and accumulates every substep into it, so one pump per step() sees the whole pour.
    // The `unsent` column is what proves it: non-zero there means a beaker is being stepped more
    // often than it is pumped, and the far end looks fine anyway because the receiver makes the
    // difference up out of clones (DECISIONS.md D62).
    mod._ps_beaker_step(i, dt);

    if (!ringClosed) continue;
    // Who physically receives the bytes. Point-to-point hands them to the downstream beaker;
    // broadcast hands the SAME packet to every other beaker, and it is then the header's `from`
    // byte -- not this loop -- that decides who keeps it.
    const dsts = broadcast
      ? Array.from({ length: N }, (_, k) => k).filter((k) => k !== i)
      : (downstream[i] == null || downstream[i] === i ? [] : [downstream[i]]);
    if (dsts.length === 0) continue;
    for (const pkt of packetsFrom(i)) {
      if (Math.random() < dropRate) { jsDropped++; continue; }
      if (Math.random() < corruptRate) {
        pkt[(Math.random() * pkt.length) | 0] ^= 0xff;
        jsCorrupted++;
      }
      // One copy per destination: a broadcast is one transmission, but each receiver holds its own
      // bytes, and sharing the array would let one beaker's corruption reach another's copy.
      for (const dst of dsts) inflight.push({ bytes: pkt.slice(), dst, at: frameNo + latency });
    }
  }
  for (let k = inflight.length - 1; k >= 0; k--) {
    const p = inflight[k];
    if (p.at > frameNo) continue;
    inflight.splice(k, 1);
    deliver(p.dst, p.bytes);
  }
}

// --- orientation --------------------------------------------------------------------------------
// One quaternion per beaker: a global tilt (drag, or the "pour all" slider) composed with that
// beaker's own. Gravity stays world-down inside the core, so this is the whole of the interaction.
const qGlobal = new THREE.Quaternion();
const tiltDeg = new Array(N).fill(0);
const Z = new THREE.Vector3(0, 0, 1);
let tiltAllDeg = 0;

function orientAll() {
  const qAll = new THREE.Quaternion().setFromAxisAngle(Z, -tiltAllDeg * Math.PI / 180);
  for (let i = 0; i < N; i++) {
    // Negative about +Z tips the open top toward +X, which is the direction the row runs and so
    // the direction of the downstream neighbour: "pour right" pours into the next beaker.
    const q = new THREE.Quaternion()
      .setFromAxisAngle(Z, -tiltDeg[i] * Math.PI / 180)
      .premultiply(qAll)
      .premultiply(qGlobal);
    view.beakers[i].body.quaternion.copy(q);
    mod._ps_beaker_orient(i, q.x, q.y, q.z, q.w);
  }
}

let dragging = false;
const DRAG = 0.0065;
const canvas = view.renderer.domElement;
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  qGlobal.premultiply(new THREE.Quaternion()
    .setFromAxisAngle(view.camUp(), e.movementX * DRAG)
    .multiply(new THREE.Quaternion().setFromAxisAngle(view.camRight(), e.movementY * DRAG)));
});
const endDrag = (e) => {
  if (!dragging) return;
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch { /* already gone */ }
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// --- controls -----------------------------------------------------------------------------------
const el = (id) => document.getElementById(id);
const bind = (id, fmt, set) => {
  const r = el(id), v = el(id + 'V');
  r.oninput = () => { set(+r.value); v.textContent = fmt(+r.value); };
  r.oninput();
};
bind('drop', (x) => x + '%', (x) => { dropRate = x / 100; });
bind('lat', (x) => x + 'f', (x) => { latency = x; });
bind('cor', (x) => x + '%', (x) => { corruptRate = x / 100; });
bind('tiltAll', (x) => x + '°', (x) => { tiltAllDeg = x; });


// A picked RGB is projected onto the dye simplex: core stores two components and implies blue as
// what is left over, so only the RATIO between the three carries. Pure white and pure grey both
// land on the same point, which is honest — the cube cannot render "unsaturated".
function rgbToDye(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
  const s = r + g + b;
  if (s === 0) return [0, 0];                 // black -> blue, the default dye
  return [Math.round(255 * r / s), Math.round(255 * g / s)];
}
const dyeToHex = (r, g) => {
  const b = Math.max(0, 255 - r - g);
  const m = Math.max(r, g, b, 1);
  const f = (v) => Math.round(255 * v / m).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
};

const brows = el('brows'), crows = el('crows');
const bcell = [], ccell = [];
for (let i = 0; i < N; i++) {
  const tr = document.createElement('tr');
  const [r0, g0] = START_DYE[i % 4];
  tr.innerHTML =
    `<td>${i}</td>` +
    `<td><input type="color" data-dye="${i}" value="${dyeToHex(r0, g0)}"></td>` +
    `<td><span class="swatch" data-mix="${i}"></span></td>` +
    `<td class="n" data-fill="${i}">—</td>` +
    `<td><span class="bar"><i data-bar="${i}" style="width:0"></i></span></td>` +
    `<td><select data-next="${i}"></select></td>` +
    `<td><input type="range" data-tilt="${i}" min="-90" max="90" value="0" style="width:58px">` +
    `<button data-reset="${i}">reset</button></td>`;
  brows.append(tr);
  bcell.push({ mix: tr.querySelector('[data-mix]'), fill: tr.querySelector('[data-fill]'),
               bar: tr.querySelector('[data-bar]') });

  const sel = tr.querySelector('[data-next]');
  sel.innerHTML = `<option value="-1">—</option>` +
    Array.from({ length: N }, (_, j) => j === i ? '' : `<option value="${j}">${j}</option>`).join('');
  sel.value = String(downstream[i]);

  const cr = document.createElement('tr');
  cr.innerHTML = `<td>${i}</td>` + '<td class="n"></td>'.repeat(9);
  crows.append(cr);
  ccell.push(Array.from(cr.children).slice(1));
}

// ?tilt=<deg> and ?tilt=<i>:<deg>,... open the page already pouring, so a state worth looking at
// can be linked to rather than described. Purely a starting position; the sliders still own it.
for (const part of (qs.get('tilt') || '').split(',').filter(Boolean)) {
  const [a, b] = part.split(':');
  if (b === undefined) { el('tiltAll').value = a; el('tiltAll').dispatchEvent(new Event('input')); }
  else {
    const i = +a;
    if (i >= 0 && i < N) {
      tiltDeg[i] = +b;
      const r = brows.querySelector(`[data-tilt="${i}"]`);
      if (r) r.value = b;
    }
  }
}

brows.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.dye !== undefined) {
    const [r, g] = rgbToDye(t.value);
    mod._ps_beaker_set_dye(+t.dataset.dye, r, g);
  } else if (t.dataset.tilt !== undefined) {
    tiltDeg[+t.dataset.tilt] = +t.value;
  } else if (t.dataset.next !== undefined) {
    const v = +t.value;
    downstream[+t.dataset.next] = v < 0 ? null : v;
    view.setChain(ringClosed ? downstream : null);
    applyAddressing();
  }
});
brows.addEventListener('click', (e) => {
  const i = e.target.dataset?.reset;
  // A reset refills and restores the beaker's OWN dye, not the mixture it has become: the cube's
  // identity is what it was configured with (DECISIONS.md D64). It deliberately does not touch the
  // chain counters — downstream sees totalOut restart at zero, exactly as when a board reboots.
  if (i !== undefined) mod._ps_beaker_reset(+i);
});

el('ringBtn').onclick = () => {
  ringClosed = !ringClosed;
  el('ringBtn').classList.toggle('on', ringClosed);
  el('ringBtn').textContent = ringClosed ? 'ring closed' : 'ring BROKEN';
  view.setChain(ringClosed ? downstream : null);
  // Packets already in the air when the ring opens are NOT recalled: they were sent, so they
  // arrive. Dropping them here would hide the one frame of grace a real link has.
};
el('resetAll').onclick = () => { for (let i = 0; i < N; i++) mod._ps_beaker_reset(i); startFill = totalFill(); startDye = totalDye(); };
// ?bloom=0 opens with it off. Bloom is a look, and this page is also a measuring instrument: the
// unbloomed picture is the one that matches what a panel actually resolves to.
if (qs.get('bloom') === '0') {
  view.bloomPass.enabled = false;
  el('bloomBtn').classList.remove('on');
}
el('castBtn').onclick = () => {
  broadcast = !broadcast;
  el('castBtn').classList.toggle('on', broadcast);
  el('castBtn').textContent = broadcast ? 'broadcast' : 'point-to-point';
};
el('addrBtn').onclick = () => {
  addressed = !addressed;
  el('addrBtn').classList.toggle('on', addressed);
  el('addrBtn').textContent = addressed ? 'addressed' : 'UNADDRESSED';
  applyAddressing();
  // setChainPosition re-baselines the receiver (D66), so the counters that survive it describe a
  // different link from the ones before it. Rebasing the display keeps the two from being added up.
  base = Array.from({ length: N }, (_, k) => statsOfN(k).slice());
};
el('bloomBtn').onclick = () => {
  const on = !view.bloomPass.enabled;
  view.bloomPass.enabled = on;
  el('bloomBtn').classList.toggle('on', on);
};
el('zeroStats').onclick = () => {
  base = Array.from({ length: N }, (_, i) => statsOfN(i).slice());
  jsDropped = jsCorrupted = jsDelivered = 0;
};

view.setChain(downstream);
let ringPos = applyAddressing();

// ?cast=broadcast and ?addr=0 open the page in the configuration that reproduces D66.
if (qs.get('cast') === 'broadcast') el('castBtn').click();
if (qs.get('addr') === '0') el('addrBtn').click();

// --- readouts -----------------------------------------------------------------------------------
const totalFill = () => { let t = 0; for (let i = 0; i < N; i++) t += mod._ps_beaker_fill(i); return t; };
const totalDye = () => { let t = 0; for (let i = 0; i < N; i++) t += chromaOf(i)[3]; return t; };
let startFill = totalFill(), startDye = totalDye();

function hud() {
  let fill = 0, dye = 0, unsentAny = 0, wildShortfall = false;
  for (let i = 0; i < N; i++) {
    const n = mod._ps_beaker_fill(i), cap = mod._ps_beaker_capacity(i);
    fill += n;
    const c = chromaOf(i);
    dye += c[3];
    const px = (v) => Math.round(255 * Math.max(0, Math.min(1, v)));
    bcell[i].mix.style.background = `rgb(${px(c[0])},${px(c[1])},${px(c[2])})`;
    bcell[i].fill.textContent = n;
    // Amber at 90% of capacity: a beaker that full starts refusing arrivals, and `refus` below is
    // where that shows up. This is the condition D63 exists to prevent, so it is named on screen
    // rather than left to be inferred from a rejection count.
    bcell[i].fill.className = 'n ' + (n > cap * 0.9 ? 'warn' : '');
    bcell[i].bar.style.width = Math.round(100 * Math.min(1, n / cap)) + '%';
    bcell[i].bar.style.background = n > cap * 0.9 ? '#e0a33e' : '#3f8fd0';

    const s = statsOfN(i), b = base[i];
    const d = (k) => s[k] - b[k];
    const cells = ccell[i];
    const put = (k, v, cls) => { cells[k].textContent = v; cells[k].className = 'n ' + (cls || ''); };
    put(0, d(S.partOut));
    put(1, d(S.partIn));
    put(2, d(S.unsent), d(S.unsent) ? 'bad' : 'dim');
    // A shortfall larger than the whole ring could hold is not a lost packet, it is a corrupted
    // totalOut -- and the pump will pay it off at kSpillMaxPerPacket a frame for as long as the
    // page is open. Flagged rather than merely displayed, because the number is the ONLY symptom:
    // `bad` stays zero and the fill stays plausible while the beaker fills itself with clones.
    // See M4-E-FINDINGS.md; one flipped byte produced a debt of 16711680.
    const wild = d(S.shortfall) > cap * N;
    put(3, wild ? d(S.shortfall) + ' !' : d(S.shortfall),
        wild ? 'bad' : (d(S.shortfall) ? 'warn' : 'dim'));
    if (wild) wildShortfall = true;
    put(4, d(S.madeUp), d(S.madeUp) ? 'ok' : 'dim');
    put(5, d(S.bad), d(S.bad) ? 'warn' : 'dim');
    put(6, d(S.rejected), d(S.rejected) ? 'bad' : 'dim');
    put(7, d(S.queueDropped) + d(S.carrier), (d(S.queueDropped) + d(S.carrier)) ? 'warn' : 'dim');
    // Heard but not taken. Zero point-to-point; on a broadcast it is the count that stands between
    // a correct ring and D66's fill-from-nothing, so it reads green rather than as a fault.
    put(8, d(S.foreign), d(S.foreign) ? 'ok' : 'dim');
    unsentAny += d(S.unsent);
  }

  const dFill = fill - startFill, dDye = dye - startDye;
  const pc = (a, b) => (b === 0 ? '0.0' : (100 * a / b).toFixed(1));
  el('totFill').textContent = fill;
  el('totFill').className = 'n ' + (Math.abs(dFill) > startFill * 0.05 ? 'warn' : 'ok');
  el('totNote').innerHTML =
    `<span class="${Math.abs(dFill) > startFill * 0.05 ? 'warn' : 'ok'}">${dFill >= 0 ? '+' : ''}${dFill} ` +
    `(${pc(dFill, startFill)}%)</span> · dye ${pc(dDye, startDye)}%`;

  el('perf').textContent = `${fps.toFixed(1)} fps · ${fill} particles solved · ` +
    `${inflight.length} packets in the air`;

  ringPos = addressed ? ringOrder() : null;
  const carrier = broadcast
    ? (ringPos
        ? `Broadcast: every beaker hears every packet and keeps only its upstream's — <b>foreign</b> is what it ignores.`
        : `<b class="bad">Broadcast and UNADDRESSED.</b> Every beaker injects what all the others poured, so the ring fills up out of nothing — watch the total rise (D66).`)
    : `Point-to-point: JS hands each packet to one beaker, so addressing cannot change the outcome and <b>foreign</b> stays zero. The radio has no such option.`;

  const wildNote = wildShortfall
    ? `<br><b class="bad">A shortfall larger than the ring can hold — that is a corrupted totalOut, ` +
      `not a lost packet. Fletcher-16 is computed mod 255, so 0x00 and 0xFF are congruent and a ` +
      `zero header byte flipped to 0xFF passes the checksum. The pump will make up the difference ` +
      `at ${18} particles a frame indefinitely.</b>`
    : '';

  el('note').innerHTML = carrier + wildNote + '<br>' + (ringClosed
    ? `Ring closed. Total fill should hold — what beaker <i>i</i> loses, <i>${downstream[0]}</i>… gains. ` +
      `Drop packets and <span class="warn">short</span> rises with <span class="ok">made</span> ` +
      `right behind it: the ring does not drain. ` +
      (unsentAny ? `<b class="bad">unsent is non-zero — a beaker is being stepped more often than ` +
                   `it is pumped, and the far end looks fine anyway.</b>` : '')
    : `<b>Ring broken.</b> Each beaker keeps what it has and loses what it spills — fill should ` +
      `fall monotonically and never recover. That is the single-cube behaviour.`);
}

// ?warm=<seconds> runs the chain forward at a fixed 1/60 step before the first frame is drawn.
//
// A pour is a second or two in, and a page that has to be watched for two seconds cannot be
// captured in a screenshot or linked to. Fixed step rather than wall-clock, so the same URL lands
// on the same state every time -- the whole page is a debugging instrument, and one whose starting
// point depends on how fast the machine is would be a poor one.
{
  const warm = Math.min(60, Math.max(0, parseFloat(qs.get('warm') || '0') || 0));
  orientAll();
  for (let f = 0; f < Math.round(warm * 60); f++) stepChain(1 / 60);
  // The baseline is deliberately NOT rebased after the warm-up. It was, and in the one case that
  // matters most -- broadcast and unaddressed -- the ring ballooned during the warm-up, saturated,
  // fell back, and the readout showed -46% while the actual fact was that it had nearly trebled.
  // A conservation readout measured from anywhere but the start is not a conservation readout.
}

// --- loop ---------------------------------------------------------------------------------------
let last = performance.now(), fps = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fps += ((1 / Math.max(dt, 1e-3)) - fps) * 0.08;

  orientAll();
  stepChain(dt);
  for (let i = 0; i < N; i++) {
    mod._ps_beaker_render(i);
    for (const p of view.beakers[i].panels) p.tex.needsUpdate = true;
  }
  view.controls.update();
  view.render();
  hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
